name: Apply backend implementation bundle

on:
  push:
    branches:
      - feat/document-editor-ui
    paths:
      - .github/backend-update.tar.gz.b64
      - .github/workflows/apply-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/document-editor-ui

      - name: Apply staged files
        run: |
          set -euo pipefail
          bundle=.github/backend-update.tar.gz.b64
          if [[ ! -f "$bundle" ]]; then
            echo "Backend bundle already applied."
            exit 0
          fi
          base64 --decode "$bundle" > /tmp/backend-update.tar.gz
          echo "af9f259e0681be7b550599591f35f3079980cb6b64d74c60704fac616628a419  /tmp/backend-update.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/backend-update.tar.gz --exclude='.github/workflows/*'
          rm "$bundle"

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add Cloudflare Worker and D1 backend"
          git push origin HEAD:feat/document-editor-ui
