name: Scaffold and verify frontend

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore handwritten frontend source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .scaffold/write-skill-source.tar.gz.b64 | tar -xz
          rm -rf .scaffold

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Add shadcn Base UI components
        run: npx --yes shadcn@latest add sidebar button input separator skeleton -y -o -s

      - name: Add official Tiptap Simple Editor template
        env:
          CI: "true"
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import pty
          import select
          import signal
          import sys
          import time
          from pathlib import Path

          command = [
              "npx",
              "--yes",
              "@tiptap/cli@latest",
              "add",
              "simple-editor",
              "-o",
              "-s",
          ]
          deadline = time.monotonic() + 90

          pid, fd = pty.fork()
          if pid == 0:
              os.execvp(command[0], command)

          try:
              while time.monotonic() < deadline:
                  try:
                      os.write(fd, b"\n")
                  except OSError:
                      pass

                  readable, _, _ = select.select([fd], [], [], 0.25)
                  if not readable:
                      continue

                  try:
                      chunk = os.read(fd, 8192)
                  except OSError:
                      break
                  if not chunk:
                      break

                  sys.stdout.buffer.write(chunk)
                  sys.stdout.buffer.flush()
          finally:
              try:
                  os.killpg(pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  os.waitpid(pid, 0)
              except ChildProcessError:
                  pass
              try:
                  os.close(fd)
              except OSError:
                  pass

          components = Path("src/components")
          matches = sorted(components.rglob("simple-editor.tsx"), key=lambda item: len(item.parts))
          if not matches:
              matches = sorted(
                  (
                      item
                      for item in components.rglob("*.tsx")
                      if "simple" in item.name.lower() and "editor" in item.name.lower()
                  ),
                  key=lambda item: len(item.parts),
              )

          print("Generated Simple Editor candidates:")
          for match in matches:
              print(f"- {match}")

          if not matches:
              raise SystemExit("Tiptap CLI did not generate the Simple Editor template.")

          actual = matches[0]
          expected = Path("src/components/tiptap-templates/simple/simple-editor.tsx")
          if actual != expected:
              expected.parent.mkdir(parents=True, exist_ok=True)
              module_path = actual.relative_to("src").with_suffix("").as_posix()
              expected.write_text(
                  f'export * from "@/{module_path}"\n',
                  encoding="utf-8",
              )
              print(f"Created compatibility export: {expected} -> {actual}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SIMPLE_EDITOR_PATH={actual.as_posix()}\n")

          print(f"Official Simple Editor source is present: {actual}")
          PY

      - name: Connect Simple Editor to the workspace store
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          script = Path("scripts/patch-tiptap.mjs")
          source = script.read_text(encoding="utf-8")
          source = source.replace(
              'const filePath = "src/components/tiptap-templates/simple/simple-editor.tsx"',
              'const filePath = process.env.SIMPLE_EDITOR_PATH\nif (!filePath) throw new Error("SIMPLE_EDITOR_PATH is not set")',
          )
          script.write_text(source, encoding="utf-8")
          PY
          node scripts/patch-tiptap.mjs

      - name: Build production bundle
        run: npm run build

      - name: Replace bootstrap workflow with permanent CI
        shell: bash
        run: |
          cat > .github/workflows/scaffold-and-build.yml <<'WORKFLOW'
          name: Verify frontend

          on:
            push:
              branches: [main, feat/document-editor-frontend]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: frontend-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Build production bundle
                  run: npm run build
          WORKFLOW

      - name: Commit verified source and generated components
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated sources are already committed."
          else
            git commit -m "feat: build document editor frontend"
            git push origin HEAD:${{ github.head_ref }}
          fi
