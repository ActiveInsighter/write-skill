name: Verify application

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build application
        run: npm run build

      - name: Verify current production deployment
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/verify-production-cbc4147'
        env:
          DEPLOYMENT_URL: https://write-skill.2212148739lbw.workers.dev
          EXPECTED_ENTRY_ASSET: index-CKXHMpgy.js
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "$DEPLOYMENT_URL/")"
          grep --fixed-strings --quiet "$EXPECTED_ENTRY_ASSET" <<< "$html"
          node scripts/smoke-test.mjs "$DEPLOYMENT_URL"
