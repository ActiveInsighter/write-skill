name: Full-stack CI

on:
  push:
    branches: [main, feat/frontend-editor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck frontend and Worker
        run: npm run typecheck

      - name: Validate local D1 migrations
        run: npm run d1:migrate:local

      - name: Build React application
        run: vite build

      - name: Bundle Worker dry run
        run: npm run worker:dry-run
