<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta
      name="description"
      content="Write Skill — a focused, local-first document workspace built with React and Tiptap."
    />
    <script>
      ;(() => {
        try {
          const preference = localStorage.getItem("write-skill-theme")
          const isDark =
            preference === "dark" ||
            (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", isDark)
          document.documentElement.style.colorScheme = isDark ? "dark" : "light"
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", isDark ? "#1b1a18" : "#f8f7f4")
        } catch {
          // Keep the light theme when storage or media queries are unavailable.
        }
      })()
    </script>
    <title>Write Skill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
